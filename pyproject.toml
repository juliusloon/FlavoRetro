[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "flavoretro"
version = "0.1.0"
description = "Evidence-aware flavonoid retrosynthesis research workbench"
requires-python = ">=3.10,<3.11"
dependencies = ["aizynthfinder==4.4.1", "rdkit==2023.9.6", "numpy==1.26.4", "pydantic==2.13.4"]
[project.scripts]
flavoretro = "flavoretro.cli:main"
[tool.setuptools.packages.find]
include = ["flavoretro*"]
