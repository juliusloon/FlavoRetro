name: Engineering foundations
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      FLAVORETRO_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: environment/requirements-linux-py310.lock
      - name: Install independent pinned dependencies
        run: python -B scripts/operate.py TASK-012-CI python -m pip install -r environment/requirements-linux-py310.lock
      - name: Dependency and asset-free contracts
        run: |
          python -B scripts/operate.py TASK-012-CI python -m pip check
          python -B scripts/operate.py TASK-012-CI python -B -m unittest discover -s tests -v
      - name: Build wheel and source archive
        run: python -B scripts/operate.py TASK-012-CI python -m build --outdir dist
      - name: Artifact boundaries
        run: python -B scripts/operate.py TASK-012-CI python -B scripts/artifact_check.py dist
      - name: Install wheel and verify outside checkout
        run: |
          python -B scripts/operate.py TASK-012-CI bash -eu -c '
            python -m pip install --no-deps --force-reinstall dist/*.whl
            scratch=$(mktemp -d)
            cd "$scratch"
            export FLAVORETRO_WORKSPACE="$scratch/workspace"
            python -I -B -c "from flavoretro.contracts import SearchRequest; from flavoretro.workspace import PACKAGE; assert SearchRequest(smiles=\"CCO\").phases(); assert (PACKAGE/\"assets/web/index.html\").is_file()"
            python -I -B -m flavoretro.cli --help
            python -I -B -m flavoretro.web --help
          '
      - name: Scope
        run: python -B scripts/operate.py TASK-012-CI echo 'Private raw/model assets absent. Live MCTS and browser evidence are verified locally; skipped local-asset contracts are not scientific or search acceptance.'
